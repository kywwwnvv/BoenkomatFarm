<!DOCTYPE html>
<html>
<head>
    <title>Boenkomat Farm — Key</title>
    <meta charset="UTF-8">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            background: linear-gradient(-45deg, #1a0f2e, #2e1a2e, #1a1a3e, #0f1a4e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            font-family: 'Segoe UI', 'Gotham', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1 {
            color: #a06aff;
            font-size: 28px;
            margin: 0 0 30px 0;
            text-shadow: 0 0 20px rgba(160, 106, 255, 0.5);
        }
        .key {
            font-size: 32px;
            color: #000;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            border: 2px solid #a06aff;
            border-radius: 12px;
            padding: 25px 50px;
            display: inline-block;
            min-width: 300px;
            text-align: center;
            box-shadow: 0 0 30px rgba(160, 106, 255, 0.4);
        }
        .copy-btn {
            background: #a06aff;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(160, 106, 255, 0.5);
        }
        .copy-btn:hover { background: #8040dd; }
        .copy-btn.copied { background: #00cc44; }
    </style>
</head>
<body>
    <h1>🌾 Boenkomat Farm — Key</h1>
    <div class="key" id="keyDisplay">Loading...</div>
    <button class="copy-btn" id="copyBtn" onclick="copyKey()">📋 Copy Key</button>

    <script>
        const SECRET = "BoenkomatSecret2025_v1";
        const KEY_PREFIX = "boen_";
        const KEY_LENGTH = 8;
        const MAX_INDEX = 1000;
        const KEY_LIFETIME = 30 * 60 * 1000;
        const STORAGE_KEY = "boenkomat_current_key";
        const STORAGE_TIME = "boenkomat_key_time";

        function rotl32(x, n) {
            return ((x << n) | (x >>> (32 - n))) >>> 0;
        }

        function simpleHash(str, seed) {
            let h = seed >>> 0;
            for (let i = 0; i < str.length; i++) {
                const byte = str.charCodeAt(i) & 0xFF;
                h = (h ^ byte) >>> 0;
                h = rotl32(h, 5);
                h = (h + 0x9E3779B9) >>> 0;
            }
            h = (h ^ (h >>> 16)) >>> 0;
            h = rotl32(h, 13);
            h = (h ^ (h >>> 7)) >>> 0;
            h = rotl32(h, 17);
            h = (h ^ (h >>> 5)) >>> 0;
            return h >>> 0;
        }

        function generateKey(index) {
            const input = KEY_PREFIX + index + "_" + SECRET;
            const h1 = simpleHash(input, 0x811C9DC5);
            const h2 = simpleHash(input + "_salt", 0x12345678);
            const h3 = simpleHash(h1.toString() + h2.toString(), 0xDEADBEEF);
            let combined = (h1 ^ rotl32(h2, 7)) >>> 0;
            combined = (combined ^ (h3 >>> 3)) >>> 0;
            combined = combined >>> 0;
            let hex = combined.toString(16).toUpperCase().padStart(8, "0");
            return hex.substring(0, KEY_LENGTH).toLowerCase();
        }

        function getRandomKey() {
            const index = Math.floor(Math.random() * MAX_INDEX) + 1;
            return generateKey(index);
        }

        let currentKey, currentKeyTime;

        function loadOrGenerateKey() {
            let saved = null, savedTime = 0;
            try {
                saved = localStorage.getItem(STORAGE_KEY);
                savedTime = parseInt(localStorage.getItem(STORAGE_TIME) || "0", 10);
            } catch (e) {}
            const now = Date.now();
            const isExpired = (now - savedTime) >= KEY_LIFETIME;
            if (saved && saved.length === KEY_LENGTH && !isExpired) {
                currentKey = saved;
                currentKeyTime = savedTime;
            } else {
                currentKey = getRandomKey();
                currentKeyTime = now;
                try {
                    localStorage.setItem(STORAGE_KEY, currentKey);
                    localStorage.setItem(STORAGE_TIME, now.toString());
                } catch (e) {}
            }
        }

        loadOrGenerateKey();
        document.getElementById("keyDisplay").textContent = currentKey;

        function copyKey() {
            navigator.clipboard.writeText(currentKey).then(function() {
                const btn = document.getElementById("copyBtn");
                btn.textContent = "✅ Copied!";
                btn.classList.add("copied");
                setTimeout(function() {
                    btn.textContent = "📋 Copy Key";
                    btn.classList.remove("copied");
                }, 2000);
            });
        }
    </script>
</body>
</html>
